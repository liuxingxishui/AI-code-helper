spring:
  application:
    name: AI-code-helper
server:
  port: 8081
  servlet:
    context-path: /api
langchain4j:
  open-ai:
    chat-model:
      model-name: kimi-k2.6
      api-key: ${KIMI_KEY}
      base-url: https://api.moonshot.cn/v1
      timeout: 300s    # 思考型模型推理耗时长，默认60s会超时，放宽到5分钟
    embedding-model:
      model-name: embedding-3
      api-key: ${GLM_KEY}
      base-url: https://open.bigmodel.cn/api/paas/v4
      max-segments-per-batch: 64    # 智谱 embedding 接口限制单次最多64条，超出会被拒
    streaming-chat-model:
      model-name: kimi-k2.6
      api-key: ${KIMI_KEY}
      base-url: https://api.moonshot.cn/v1
big-model:
  api-key: ${GLM_KEY}
logging:
  level:
    # MCP SSE 长连接 60s 无心跳会超时重连（智谱 MCP 服务端不发心跳），属正常现象，屏蔽 WARN 刷屏
    dev.langchain4j.mcp.client.transport.http.SseEventListener: ERROR